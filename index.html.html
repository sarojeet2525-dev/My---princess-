<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Air Canvas</title>
    <!-- Use Google Fonts for UI and Handwriting -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Tesseract.js for Handwriting Recognition -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d1117; /* Dark modern background */
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #videoElement {
            display: none; /* We only draw to canvas */
        }

        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The actual canvas where we render video + physics */
        #outputCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Mirrors the camera */
            transform: scaleX(-1);
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ui-overlay h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ui-overlay p {
            margin: 8px 0;
            font-size: 15px;
            font-weight: 300;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #currentColorDisplay {
            margin-top: 15px; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            background: #ff007f; 
            border: 2px solid white;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        
        #ocrStatus {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            min-height: 20px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 500;
            z-index: 20;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            background: linear-gradient(90deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="loading">Initializing Camera & AI Tracking...</div>

    <div class="canvas-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="ui-overlay">
        <h1>Air Canvas</h1>
        <p>🖐️ <strong>Open Hand:</strong> Erase (move across)</p>
        <p>☝️ <strong>Point Index:</strong> Draw / Write</p>
        <p>✌️ <strong>Peace Sign:</strong> Change Color</p>
        <p>👌 <strong>Pinch:</strong> Drag Drawings</p>
        <div id="currentColorDisplay"></div>
        <div id="ocrStatus"></div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingScreen = document.getElementById('loading');

        // Setup resize
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Drawing state
        const paths = []; // Array of {color, points: [{x, y}]}
        let currentPath = null;
        const colors = ['#ff007f', '#00f0ff', '#00ff00', '#ffd700', '#ff5722', '#ffffff'];
        let colorIndex = 0;
        let lastGesture = 'HOVER';
        let colorChangeCooldown = 0;

        // Auto-Neat Handwriting (OCR) state
        const textObjects = []; // Array of {text, x, y, color}
        const unrecognizedPaths = [];
        let ocrTimer = null;

        // Draggable objects state
        let draggedObject = null; // { type: 'path'|'text', ref: object }
        let lastPinchMidX = 0;
        let lastPinchMidY = 0;

        // Helper to check if a finger is extended
        function isFingerExtended(landmarks, tipIndex, dipIndex) {
            const tip = landmarks[tipIndex];
            const dip = landmarks[dipIndex];
            const wrist = landmarks[0];
            
            // Compare distance from wrist to tip vs wrist to dip
            const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
            const dipDist = Math.hypot(dip.x - wrist.x, dip.y - wrist.y);
            return tipDist > dipDist;
        }

        // Tesseract Core Logic
        function doOCR() {
            if (unrecognizedPaths.length === 0) return;

            // Clone paths processing queue
            const pathsToProcess = [...unrecognizedPaths];
            unrecognizedPaths.length = 0;

            // Calculate bounding box for the drawing
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            pathsToProcess.forEach(p => {
                p.points.forEach(pt => {
                    if (pt.x < minX) minX = pt.x;
                    if (pt.x > maxX) maxX = pt.x;
                    if (pt.y < minY) minY = pt.y;
                    if (pt.y > maxY) maxY = pt.y;
                });
            });

            const pad = 40;
            minX -= pad; minY -= pad; maxX += pad; maxY += pad;
            const w = maxX - minX;
            const h = maxY - minY;

            // Minimum practical size for OCR
            if (w <= pad * 2 || h <= pad * 2) return;

            // Render to offscreen canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            
            // White Background
            tempCtx.fillStyle = 'white';
            tempCtx.fillRect(0, 0, w, h);
            
            // Flip for OCR to read correctly (undoes the camera mirror effect)
            tempCtx.translate(w, 0);
            tempCtx.scale(-1, 1);
            
            // Black foreground strokes, sized adaptively
            tempCtx.strokeStyle = 'black';
            tempCtx.lineWidth = Math.min(20, Math.max(8, w / 15)); 
            tempCtx.lineCap = 'round';
            tempCtx.lineJoin = 'round';

            pathsToProcess.forEach(p => {
                if (p.points.length < 2) return;
                tempCtx.beginPath();
                tempCtx.moveTo(p.points[0].x - minX, p.points[0].y - minY);
                for (let i=1; i<p.points.length; i++) {
                    tempCtx.lineTo(p.points[i].x - minX, p.points[i].y - minY);
                }
                tempCtx.stroke();
            });

            const majorColor = pathsToProcess[pathsToProcess.length - 1].color;
            const centerX = minX + w/2;
            const centerY = minY + h/2;

            const statusEl = document.getElementById('ocrStatus');
            statusEl.innerText = "✍️ Converting handwriting...";

            Tesseract.recognize(tempCanvas, 'eng')
            .then(({ data: { text } }) => {
                statusEl.innerText = "";
                
                // Allow strict alphanumeric and basic chars
                const cleanText = text.replace(/[^a-zA-Z0-9.,?! ]/g, '').trim();
                
                if (cleanText.length > 0) {
                    // Turn to Neat Text Object
                    textObjects.push({
                        text: cleanText,
                        x: centerX,
                        y: centerY,
                        color: majorColor
                    });
                    
                    // Remove raw messy paths visually
                    pathsToProcess.forEach(p => {
                        const idx = paths.indexOf(p);
                        if (idx > -1) paths.splice(idx, 1);
                    });
                }
            }).catch(err => {
                console.error("OCR Error", err);
                statusEl.innerText = "";
            });
        }

        // --- MEDIAPIPE LOGIC ---
        function onResults(results) {
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw video frame
            canvasCtx.globalAlpha = 0.4;
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalAlpha = 1.0;

            // Draw neat text
            canvasCtx.font = "bold 80px 'Caveat', cursive";
            canvasCtx.textAlign = "center";
            canvasCtx.textBaseline = "middle";
            for (const txtObj of textObjects) {
                const isTextDragged = draggedObject && draggedObject.type === 'text' && draggedObject.ref === txtObj;
                
                canvasCtx.save();
                canvasCtx.scale(-1, 1); // Flip context because the CSS flips the entire canvas
                
                if (isTextDragged) {
                    canvasCtx.shadowColor = txtObj.color;
                    canvasCtx.shadowBlur = 20;
                    canvasCtx.fillStyle = txtObj.color;
                } else {
                    canvasCtx.shadowColor = "rgba(0,0,0,0.5)";
                    canvasCtx.shadowBlur = 8;
                    canvasCtx.fillStyle = txtObj.color;
                }
                // Draw at -x so it appears at physical x, then CSS flip makes it readable
                canvasCtx.fillText(txtObj.text, -txtObj.x, txtObj.y);
                canvasCtx.restore();
            }
            canvasCtx.shadowBlur = 0;

            // Draw existing paths
            for (const path of paths) {
                if (path.points.length < 2) continue;
                canvasCtx.beginPath();
                canvasCtx.moveTo(path.points[0].x, path.points[0].y);
                for (let i = 1; i < path.points.length; i++) {
                    canvasCtx.lineTo(path.points[i].x, path.points[i].y);
                }
                
                const isPathDragged = draggedObject && draggedObject.type === 'path' && draggedObject.ref === path;
                
                canvasCtx.strokeStyle = path.color;
                canvasCtx.lineWidth = isPathDragged ? 14 : 10;
                canvasCtx.lineCap = 'round';
                canvasCtx.lineJoin = 'round';
                
                canvasCtx.shadowColor = path.color;
                canvasCtx.shadowBlur = isPathDragged ? 25 : 10;
                canvasCtx.stroke();
                
                canvasCtx.shadowBlur = 0;
            }

            if (colorChangeCooldown > 0) colorChangeCooldown--;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const indexExtended = isFingerExtended(landmarks, 8, 6);
                const middleExtended = isFingerExtended(landmarks, 12, 10);
                const ringExtended = isFingerExtended(landmarks, 16, 14);
                const pinkyExtended = isFingerExtended(landmarks, 20, 18);

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                const isPinching = pinchDist < 0.08;

                let gesture = 'HOVER';
                if (isPinching) {
                    gesture = 'PINCH';
                } else if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
                    gesture = 'DRAW';
                } else if (indexExtended && middleExtended && !ringExtended && !pinkyExtended) {
                    gesture = 'PEACE';
                } else if (indexExtended && middleExtended && ringExtended && pinkyExtended) {
                    gesture = 'PALM';
                }

                const px = indexTip.x * canvasElement.width;
                const py = indexTip.y * canvasElement.height;
                const pinchMidX = ((indexTip.x + thumbTip.x) / 2) * canvasElement.width;
                const pinchMidY = ((indexTip.y + thumbTip.y) / 2) * canvasElement.height;
                
                // Get Palm Center for erasing
                const palmCenter = landmarks[9];
                const palmX = palmCenter.x * canvasElement.width;
                const palmY = palmCenter.y * canvasElement.height;

                // Handle pinch/drag gesture
                if (gesture === 'PINCH') {
                    if (!draggedObject) {
                        let closest = null;
                        let minDist = 70;
                        
                        // Check neat text
                        for (const txt of textObjects) {
                            const grabRadius = Math.max(70, txt.text.length * 20); 
                            const dist = Math.hypot(txt.x - pinchMidX, txt.y - pinchMidY);
                            if (dist < grabRadius && dist < minDist) {
                                minDist = dist;
                                closest = { type: 'text', ref: txt };
                            }
                        }

                        // Check drawing paths
                        for (const path of paths) {
                            for (const pt of path.points) {
                                const dist = Math.hypot(pt.x - pinchMidX, pt.y - pinchMidY);
                                if (dist < minDist) {
                                    minDist = dist;
                                    closest = { type: 'path', ref: path };
                                }
                            }
                        }
                        
                        if (closest) {
                            draggedObject = closest;
                            lastPinchMidX = pinchMidX;
                            lastPinchMidY = pinchMidY;
                        }
                    }
                    
                    if (draggedObject) {
                        const dx = pinchMidX - lastPinchMidX;
                        const dy = pinchMidY - lastPinchMidY;
                        
                        if (draggedObject.type === 'text') {
                            draggedObject.ref.x += dx;
                            draggedObject.ref.y += dy;
                        } else if (draggedObject.type === 'path') {
                            for (const pt of draggedObject.ref.points) {
                                pt.x += dx;
                                pt.y += dy;
                            }
                        }
                        
                        lastPinchMidX = pinchMidX;
                        lastPinchMidY = pinchMidY;
                    }
                } else {
                    draggedObject = null;
                }

                // Handle draw gesture
                if (gesture === 'DRAW') {
                    if (lastGesture !== 'DRAW') {
                        currentPath = { color: colors[colorIndex], points: [] };
                        paths.push(currentPath);
                        unrecognizedPaths.push(currentPath);
                        if (ocrTimer) clearTimeout(ocrTimer);
                    }
                    if (currentPath) {
                        currentPath.points.push({ x: px, y: py });
                    }
                } else {
                    if (lastGesture === 'DRAW') {
                        // Started waiting! Give ~1.5 seconds from last stroke before assuming Word is complete 
                        ocrTimer = setTimeout(doOCR, 1500); 
                    }
                    currentPath = null;
                }

                // Handle color change gesture (Peace sign)
                if (gesture === 'PEACE' && colorChangeCooldown === 0) {
                    colorIndex = (colorIndex + 1) % colors.length;
                    colorChangeCooldown = 40; 
                    const cd = document.getElementById('currentColorDisplay');
                    cd.style.background = colors[colorIndex];
                    cd.style.boxShadow = `0 0 12px ${colors[colorIndex]}80`;
                }
                
                // Handle palm erase gesture
                if (gesture === 'PALM') {
                    const eraseRadius = 80; // Size of the virtual eraser block
                    
                    // Erase text objects
                    for (let i = textObjects.length - 1; i >= 0; i--) {
                        const txt = textObjects[i];
                        const textRadius = Math.max(70, txt.text.length * 20);
                        const dist = Math.hypot(txt.x - palmX, txt.y - palmY);
                        if (dist < eraseRadius + textRadius) {
                            textObjects.splice(i, 1);
                        }
                    }
                    
                    // Erase paths
                    for (let i = paths.length - 1; i >= 0; i--) {
                        const path = paths[i];
                        let erased = false;
                        for (const pt of path.points) {
                            const dist = Math.hypot(pt.x - palmX, pt.y - palmY);
                            if (dist < eraseRadius) {
                                erased = true;
                                break;
                            }
                        }
                        if (erased) {
                            paths.splice(i, 1);
                            // Also try to remove from unrecognizedPaths if present
                            const upIdx = unrecognizedPaths.indexOf(path);
                            if (upIdx > -1) unrecognizedPaths.splice(upIdx, 1);
                        }
                    }
                }

                lastGesture = gesture;

                // Draw hand landmarks
                for (const handLms of results.multiHandLandmarks) {
                    // Hide the standard skeleton if erasing to emphasize the eraser tool
                    if (gesture !== 'PALM') {
                        drawConnectors(canvasCtx, handLms, HAND_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.2)', lineWidth: 2});
                        drawLandmarks(canvasCtx, handLms, {color: gesture === 'PINCH' ? '#ffffff' : colors[colorIndex], lineWidth: 1, radius: 2});
                    }
                }
                
                // Cursor UI
                canvasCtx.beginPath();
                const pointerX = gesture === 'PINCH' ? pinchMidX : (gesture === 'PALM' ? palmX : px);
                const pointerY = gesture === 'PINCH' ? pinchMidY : (gesture === 'PALM' ? palmY : py);
                
                if (gesture === 'PALM') {
                    // Show a glowing eraser area
                    canvasCtx.arc(pointerX, pointerY, 80, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = 'rgba(255, 50, 50, 0.2)';
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = 'rgba(255, 50, 50, 0.8)';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.stroke();
                } else {
                    canvasCtx.arc(pointerX, pointerY, 15, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = (gesture === 'DRAW' || gesture === 'PINCH') ? colors[colorIndex] + '80' : 'rgba(255, 255, 255, 0.3)';
                    canvasCtx.fill();
                    
                    canvasCtx.beginPath();
                    canvasCtx.arc(pointerX, pointerY, 8, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = (gesture === 'DRAW' || gesture === 'PINCH') ? colors[colorIndex] : 'white';
                    canvasCtx.fill();
                }
                
            } else {
                currentPath = null;
                draggedObject = null;
                lastGesture = 'HOVER';
            }

            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();

    </script>
</body>
</html>
