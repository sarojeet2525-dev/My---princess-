<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Romantic Web Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Poppins',sans-serif;
 overflow:hidden;
 background:linear-gradient(135deg,#ff9a9e,#fad0c4);
 color:white;
 text-align:center;
 transition:background 1s ease;
}

.screen{
 height:100vh;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:20px;
 opacity:0;
 transform:translateY(30px);
 transition:0.8s;
}

.screen.show{
 opacity:1;
 transform:translateY(0);
}

.hidden{display:none;}

h1,h2{
 font-family:'Dancing Script',cursive;
}

button{
 padding:10px 25px;
 border:none;
 border-radius:25px;
 background:white;
 color:#ff4e50;
 font-weight:600;
 cursor:pointer;
 margin-top:20px;
 transition:0.3s;
}

button:hover{
 transform:scale(1.05);
}

#slide{
 width:260px;
 border-radius:15px;
 border:4px solid white;
 box-shadow:0 10px 25px rgba(0,0,0,0.3);
 transition:0.6s ease;
}

#caption{
 margin-top:15px;
 font-size:1rem;
}

.fade-out{
 opacity:0;
 transform:scale(1.1);
}

.confetti{
 position:fixed;
 top:-20px;
 font-size:20px;
 animation:fall 4s linear forwards;
}

@keyframes fall{
 to{
  transform:translateY(120vh) rotate(360deg);
  opacity:0;
 }
}

.footer{
 position:fixed;
 bottom:10px;
 width:100%;
 font-size:0.8rem;
 opacity:0.6;
}
</style>
</head>

<body>

<!-- Welcome -->
<div id="welcome" class="screen show">
 <h1>Interactive Romantic Web Experience 💖</h1>
 <p>Premium Demo Version</p>
 <button onclick="start()">Begin Experience</button>
</div>

<!-- Slideshow -->
<div id="slideshow" class="screen hidden">
 <h2>Animated Slideshow</h2>
 <img id="slide">
 <div id="caption"></div>
 <button onclick="next()">Next Memory</button>
</div>

<!-- Features -->
<div id="features" class="screen hidden">
 <h2>Dynamic Features</h2>
 <p>✔ Smooth Transitions</p>
 <p>✔ Typewriter Effects</p>
 <p>✔ Interactive Flow</p>
 <p>✔ Celebration Animation</p>
 <button onclick="showProposal()">Continue</button>
</div>

<!-- Proposal -->
<div id="proposal" class="screen hidden">
 <h2 id="proposalText"></h2>
 <button onclick="celebrate()">Simulate Celebration 🎉</button>
</div>

<div class="footer">
 Built with HTML • CSS • JavaScript
</div>

<script>

let images=[
 "https://picsum.photos/400/600?random=1",
 "https://picsum.photos/400/600?random=2",
 "https://picsum.photos/400/600?random=3",
 "https://picsum.photos/400/600?random=4",
 "https://picsum.photos/400/600?random=5"
];

let captions=[
 "Beautiful Animated Transitions ✨",
 "Dynamic Image Handling 📸",
 "Responsive Layout 📱",
 "Interactive User Flow 💞",
 "Cinematic Ending Scene 💍"
];

let index=0;

function show(id){
 document.querySelectorAll(".screen").forEach(s=>{
  s.classList.remove("show");
  s.classList.add("hidden");
 });
 let el=document.getElementById(id);
 el.classList.remove("hidden");
 setTimeout(()=>el.classList.add("show"),20);
}

function start(){
 show("slideshow");
 document.getElementById("slide").src=images[0];
 document.getElementById("caption").innerHTML=captions[0];
}

function next(){
 index++;
 if(index<images.length){
  let slide=document.getElementById("slide");
  slide.classList.add("fade-out");
  setTimeout(()=>{
   slide.src=images[index];
   document.getElementById("caption").innerHTML=captions[index];
   slide.classList.remove("fade-out");
  },300);
 }else{
  show("features");
  document.body.style.background="linear-gradient(135deg,#a18cd1,#fbc2eb)";
 }
}

function showProposal(){
 show("proposal");
 typeWriter("This Interactive Experience Ends With A Celebration 💖","proposalText");
 document.body.style.background="linear-gradient(135deg,#ff9a9e,#ffdde1)";
}

function typeWriter(text,id){
 let i=0;
 let el=document.getElementById(id);
 el.innerHTML="";
 function type(){
  if(i<text.length){
   el.innerHTML+=text.charAt(i);
   i++;
   setTimeout(type,50);
  }
 }
 type();
}

function celebrate(){
 for(let i=0;i<60;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.innerHTML=["💖","✨","🎉","🌸"][Math.floor(Math.random()*4)];
  c.style.left=Math.random()*100+"vw";
  c.style.fontSize=(Math.random()*20+15)+"px";
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4000);
 }
}

</script>

</body>
</html>
